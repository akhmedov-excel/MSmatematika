<!doctype html><meta charset="utf-8"><title>MS Matematika QR Print Sheet</title><style>body{font-family:Arial,sans-serif;margin:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.c{border:1px solid #aaa;border-radius:8px;padding:10px;text-align:center;break-inside:avoid}.c img{width:100%;max-width:220px}.n{font-weight:700;margin-top:4px}@media print{button{display:none}.c{page-break-inside:avoid}}</style><button onclick="print()">Print</button><div class="grid" id="g"></div><script>let h='';for(let i=1;i<=20;i++)h+=`<div class="c"><img src="../qr/variant-${String(i).padStart(2,'0')}.png"><div class="n">MATEMATIKA MILLIY SERTIFIKAT — ${i}-VARIANT</div></div>`;g.innerHTML=h</script>
